# FIX-PENDING-17/19: crashloop ceiling. StartLimitBurst/StartLimitIntervalSec
# are [Unit] directives — systemd ignores them under [Service] (the old stray
# [Service] StartLimitBurst=10 did nothing). With Restart=always/RestartSec=5,
# the default 5-in-10s window is never reached, so without this the service
# restarts forever (AUDIT-004). 10 starts / 600s caps the loop.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=10
