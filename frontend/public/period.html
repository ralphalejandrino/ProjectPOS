<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Period Report — TarsierPOS</title>
    <script>if(localStorage.getItem('darkMode')==='true')document.documentElement.classList.add('dark');</script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/tarsier-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shared-styles.css">
    <script src="config.js"></script>
    <script src="components/format.js"></script>
    <script src="components/nav.js"></script>
</head>
<body class="bg-gray-50" data-page="period" style="visibility:hidden">
    <script>
        // FEATURE-013: manager/admin-only multi-day report.
        (function () {
            if (!guardPage('period')) return;
            document.body.style.visibility = '';
        })();
    </script>

    <!-- NAVIGATION (FEATURE-029: canonical shared nav) -->
    <div id="nav-mount"></div>
    <script>renderNav({ activePage: 'period' });</script>

    <div class="h-[calc(100vh-73px)] overflow-y-auto bg-gray-50">
    <div class="container mx-auto px-4 py-6">

        <!-- PAGE HEADER -->
        <div class="mb-6">
            <h2 class="text-3xl font-bold text-gray-800">🗓️ Period Report</h2>
            <p class="text-gray-600">Sales totals across a date range, drawn from finalized Z-Reports.</p>
        </div>

        <!-- DATE RANGE PICKER -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <div class="flex flex-wrap items-end gap-4">
                <div>
                    <label for="from-date" class="block text-sm font-medium text-gray-700 mb-1">From</label>
                    <input type="date" id="from-date" class="border border-gray-300 rounded-lg px-3 py-2 text-gray-800">
                </div>
                <div>
                    <label for="to-date" class="block text-sm font-medium text-gray-700 mb-1">To</label>
                    <input type="date" id="to-date" class="border border-gray-300 rounded-lg px-3 py-2 text-gray-800">
                </div>
                <button id="load-btn" onclick="loadPeriod()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium transition">
                    Load
                </button>
            </div>
            <p id="range-error" class="hidden text-red-600 text-sm mt-2"></p>
        </div>

        <!-- SUMMARY CARDS -->
        <div id="summary-row" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow-lg p-6 border-l-4 border-blue-500">
                <p class="text-sm text-gray-600 mb-1">Total Gross</p>
                <p id="sum-gross" class="text-3xl font-bold text-blue-600">—</p>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-6 border-l-4 border-emerald-500">
                <p class="text-sm text-gray-600 mb-1">Total Net</p>
                <p id="sum-net" class="text-3xl font-bold text-emerald-600">—</p>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-6 border-l-4 border-amber-500">
                <p class="text-sm text-gray-600 mb-1">Total VAT</p>
                <p id="sum-vat" class="text-3xl font-bold text-amber-600">—</p>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-6 border-l-4 border-purple-500">
                <p class="text-sm text-gray-600 mb-1">Transactions</p>
                <p id="sum-txns" class="text-3xl font-bold text-purple-600">—</p>
            </div>
        </div>

        <!-- DAILY BREAKDOWN -->
        <div id="daily-card" class="hidden bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-700">Daily Breakdown</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="px-6 py-3 text-left font-medium">Date</th>
                            <th class="px-6 py-3 text-left font-medium">Shift</th>
                            <th class="px-6 py-3 text-right font-medium">Gross</th>
                            <th class="px-6 py-3 text-right font-medium">Net</th>
                            <th class="px-6 py-3 text-right font-medium">Txns</th>
                        </tr>
                    </thead>
                    <tbody id="daily-body"></tbody>
                </table>
            </div>
        </div>

        <div id="empty-state" class="hidden text-center text-gray-400 py-16">
            No Z-Reports in this date range.
        </div>

    </div>
    </div>

    <script>
        loadSiteName();

        // Default the range to the current month-to-date.
        (function initDates() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
            const first = new Date(now.getFullYear(), now.getMonth(), 1);
            document.getElementById('from-date').value = fmt(first);
            document.getElementById('to-date').value = fmt(now);
        })();

        async function loadPeriod() {
            const from = document.getElementById('from-date').value;
            const to = document.getElementById('to-date').value;
            const errEl = document.getElementById('range-error');
            errEl.classList.add('hidden');
            if (!from || !to) {
                errEl.textContent = 'Please pick both a From and To date.';
                errEl.classList.remove('hidden');
                return;
            }
            if (from > to) {
                errEl.textContent = 'From date must not be after To date.';
                errEl.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('load-btn');
            btn.disabled = true;
            btn.textContent = 'Loading…';
            try {
                const res = await authenticatedFetch(
                    `${API_BASE}/reports/period/?from=${from}&to=${to}`
                );
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    errEl.textContent = data.error || 'Failed to load period report.';
                    errEl.classList.remove('hidden');
                    return;
                }
                const data = await res.json();
                renderPeriod(data);
            } catch (e) {
                errEl.textContent = 'Network error loading period report.';
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Load';
            }
        }

        function renderPeriod(data) {
            const s = data.summary;
            document.getElementById('sum-gross').textContent = formatCurrency(parseFloat(s.gross_total));
            document.getElementById('sum-net').textContent = formatCurrency(parseFloat(s.net_total));
            document.getElementById('sum-vat').textContent = formatCurrency(parseFloat(s.vat_amount));
            document.getElementById('sum-txns').textContent = s.transaction_count;
            document.getElementById('summary-row').classList.remove('hidden');

            const body = document.getElementById('daily-body');
            const dailyCard = document.getElementById('daily-card');
            const empty = document.getElementById('empty-state');
            if (!data.daily.length) {
                body.innerHTML = '';
                dailyCard.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            dailyCard.classList.remove('hidden');
            body.innerHTML = data.daily.map(r => `
                <tr class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="px-6 py-3 text-gray-800">${escapeHtml(r.date)}</td>
                    <td class="px-6 py-3 text-gray-600">#${r.shift_id ?? '—'} · ${escapeHtml(r.cashier)}</td>
                    <td class="px-6 py-3 text-right font-medium">${formatCurrency(parseFloat(r.gross))}</td>
                    <td class="px-6 py-3 text-right">${formatCurrency(parseFloat(r.net))}</td>
                    <td class="px-6 py-3 text-right">${r.transaction_count}</td>
                </tr>
            `).join('');
        }

        // Auto-load the default month-to-date range on first paint.
        loadPeriod();
    </script>
</body>
</html>
