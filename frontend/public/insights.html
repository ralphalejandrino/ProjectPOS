<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights — TarsierPOS</title>
    <script>if(localStorage.getItem('darkMode')==='true')document.documentElement.classList.add('dark');</script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/tarsier-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shared-styles.css">
    <script src="config.js"></script>
    <script src="components/format.js"></script>
    <script src="components/nav.js"></script>
</head>
<body class="bg-gray-50" data-page="insights" style="visibility:hidden">
    <script>
        // FEATURE-014: manager/admin-only owner insight surface (stub).
        (function () {
            if (!guardPage('insights')) return;
            document.body.style.visibility = '';
        })();
    </script>

    <!-- NAVIGATION (FEATURE-029: canonical shared nav) -->
    <div id="nav-mount"></div>
    <script>renderNav({ activePage: 'insights' });</script>

    <div class="h-[calc(100vh-73px)] overflow-y-auto bg-gray-50">
    <div class="container mx-auto px-4 py-6">

        <!-- PAGE HEADER -->
        <div class="mb-6">
            <h2 class="text-3xl font-bold text-gray-800">💡 Insights</h2>
            <p class="text-gray-600">Operational patterns to help you staff and stock.</p>
        </div>

        <!-- PEAK HOURS -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden mb-6">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-700">Peak Hours</h3>
                <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Last 30 days</span>
            </div>
            <div id="peak-hours" class="p-6 flex flex-col gap-1.5">
                <p class="text-gray-400 text-center py-8">Loading…</p>
            </div>
        </div>

        <!-- PER-CASHIER -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden mb-6">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-700">Per-Cashier Summary</h3>
                <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">This month</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="px-6 py-3 text-left font-medium">Name</th>
                            <th class="px-6 py-3 text-right font-medium">Transactions</th>
                            <th class="px-6 py-3 text-right font-medium">Gross</th>
                            <th class="px-6 py-3 text-right font-medium">Voids</th>
                        </tr>
                    </thead>
                    <tbody id="cashier-body">
                        <tr><td colspan="4" class="text-center text-gray-400 py-8">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <p class="text-center text-gray-400 text-sm">More analytics coming post-v1</p>

    </div>
    </div>

    <script>
        loadSiteName();

        async function loadInsights() {
            try {
                const res = await authenticatedFetch(`${API_BASE}/reports/insights/`);
                if (!res.ok) throw new Error('load failed');
                const data = await res.json();
                renderPeakHours(data.peak_hours || []);
                renderCashiers(data.cashiers || []);
            } catch (e) {
                document.getElementById('peak-hours').innerHTML =
                    '<p class="text-red-400 text-center py-8">Failed to load insights.</p>';
                document.getElementById('cashier-body').innerHTML =
                    '<tr><td colspan="4" class="text-center text-red-400 py-8">Failed to load.</td></tr>';
            }
        }

        function fmtHour(h) {
            const period = h < 12 ? 'AM' : 'PM';
            const hr = h % 12 === 0 ? 12 : h % 12;
            return `${hr} ${period}`;
        }

        function renderPeakHours(hours) {
            const host = document.getElementById('peak-hours');
            const max = hours.reduce((m, x) => Math.max(m, x.count), 0);
            if (!max) {
                host.innerHTML = '<p class="text-gray-400 text-center py-8">No transactions in the last 30 days.</p>';
                return;
            }
            // CSS width bars — simplest representation, matches existing pages.
            host.innerHTML = hours.map(x => {
                const pct = max ? Math.round((x.count / max) * 100) : 0;
                return `
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-500 w-14 text-right tabular-nums">${fmtHour(x.hour)}</span>
                        <div class="flex-1 bg-gray-100 rounded h-5 overflow-hidden">
                            <div class="bg-blue-500 h-5 rounded" style="width: ${pct}%"></div>
                        </div>
                        <span class="text-xs text-gray-600 w-8 tabular-nums">${x.count}</span>
                    </div>`;
            }).join('');
        }

        function renderCashiers(cashiers) {
            const body = document.getElementById('cashier-body');
            if (!cashiers.length) {
                body.innerHTML = '<tr><td colspan="4" class="text-center text-gray-400 py-8">No transactions this month.</td></tr>';
                return;
            }
            body.innerHTML = cashiers.map(c => `
                <tr class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="px-6 py-3 font-medium text-gray-800">${escapeHtml(c.name)}</td>
                    <td class="px-6 py-3 text-right">${c.txns}</td>
                    <td class="px-6 py-3 text-right font-medium">${formatCurrency(parseFloat(c.gross))}</td>
                    <td class="px-6 py-3 text-right ${c.voids ? 'text-red-600' : 'text-gray-500'}">${c.voids}</td>
                </tr>
            `).join('');
        }

        loadInsights();
    </script>
</body>
</html>
