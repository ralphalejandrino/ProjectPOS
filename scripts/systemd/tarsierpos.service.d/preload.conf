# /etc/systemd/system/tarsierpos.service.d/preload.conf
# FLAG-067: --preload catches import errors at service start, not first request
# FLAG-069: --log-level warning silences gunicorn's info-level shutdown chatter
#   ("Handling signal: term", "Worker exiting"). Those writes, when SIGTERM
#   interrupts an in-progress logging call, trigger the benign but noisy
#   "RuntimeError: reentrant call inside BufferedWriter" on every restart/stop.
#   Real warnings/errors are still logged.
# Install: sudo mkdir -p /etc/systemd/system/tarsierpos.service.d/
#          sudo install -m 0644 -o root -g root scripts/systemd/tarsierpos.service.d/preload.conf /etc/systemd/system/tarsierpos.service.d/preload.conf
#          sudo systemctl daemon-reload
[Service]
ExecStart=
ExecStart=/home/ralph/TarsierPOS/venv/bin/gunicorn pos_config.wsgi:application --bind 127.0.0.1:9000 --workers 3 --timeout 60 --preload --log-level warning
